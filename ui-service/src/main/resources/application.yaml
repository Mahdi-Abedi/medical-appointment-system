server:
  port: 8090

spring:
  application:
    name: ui-service
  http:
    serviceclient:
      auth-client:
        base-url: http://localhost:8080
      user-client:
        base-url: http://localhost:8080
      doctor-client:
        base-url: http://localhost:8080
      appointment-client:
        base-url: http://localhost:8080

vaadin:
  launch-browser: true
  whitelisted-packages: com.medapp.ui

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 2
