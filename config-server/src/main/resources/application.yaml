server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: http://localhost:3000/admin/medapp-config.git
          username: ${GITEA_USER:admin}
          password: ${GITEA_PASS:admin}
          default-label: main
          clone-on-start: true
          search-paths: '{application}'
          force-pull: true
management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.config: DEBUG

encrypt:
  key-store:
    location: config-server.jks
    password: password
    alias: config-server-key
    type: PKCS12
    secret: password