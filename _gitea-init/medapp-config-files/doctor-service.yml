server:
  port: 8082

spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: doctor
    password: '{cipher}'
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: '{cipher}'

eureka:
  client:
    should-unregister-on-shutdown: false
    refresh:
      enable: false
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  tracing:
    sampling:
      probability: 1.0